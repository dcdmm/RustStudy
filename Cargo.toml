[workspace]
resolver = "2"

# members — Packages to include in the workspace.
members = [
    "crates/a_basic",
    "crates/b_basic",
    "crates/c_pattern_matching",
    "crates/d_error_handling",
    "crates/e_container",
    "f_advanced",
    "g_concurrency", 
    "h_file_operate",
    "i_macro", 
    "x_docs",
    "x_package_crate_module",
    "x_tests",
    "x_z_other", 

    "y_serde_serde_json",

    "z_tests"
]

# 供workspace成员继承的lint配置
# 
# 继承: 成员需在自身Cargo.toml中显式声明以下内容: 
# [lints]
# workspace = true
# 
# 成员继承后,该成员不能再单独设置任何lint(如[lints.rust]、[lints.clippy])
[workspace.lints.rust]
non_snake_case = "allow"
warnings = "allow"
