[workspace]
resolver = "2"

# members — Packages to include in the workspace.
members = [
    "crates/a_basic",
    "crates/b_basic",
    "crates/c_pattern_matching",
    "crates/d_error_handling",
    "crates/e_container",
    "f_advanced",
    "g_concurrency", 
    "h_file_operate",
    "i_macro", 
    "x_docs",
    "x_package_crate_module",
    "x_tests",
    "x_z_other", 
    "y_serde_serde_json",
    "x_z_other/x_cargo_feature",
    "z_tests"
]

# 供workspace成员继承的package字段
#
# 成员需在自身[package]中按字段显式声明,如:
# version.workspace = true
# edition.workspace = true
#
# 同一字段继承后不能再单独设置(如: 继承version后不能再写version = "0.2.0")
[workspace.package]
version = "0.1.0"     # package版本号,格式为主版本.次版本.修订号
edition = "2024"      # 编译器按哪一版语法规则编译代码(可选: 2015/2018/2021/2024)
rust-version = "1.85" # 最低支持的Rust版本(MSRV),本地rustc低于该版本时报错

# 供workspace成员继承的依赖
#
# 成员需在自身[dependencies]中按依赖显式声明,如:
# serde.workspace = true
# serde_json.workspace = true
#
# 继承后可以追加features,但不能修改version(如: serde = { workspace = true, features = ["rc"] })
#
# 版本写法(省略前缀时等同于^):
# "1.0"    -> >=1.0.0, <2.0.0
# "0.8.5"  -> >=0.8.5, <0.9.0
# "~1.2.3" -> >=1.2.3, <1.3.0
# "=1.2.3" -> 只能是1.2.3
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 供workspace成员继承的rustc lint配置
# 
# 成员需在自身Cargo.toml中显式声明以下内容: 
# [lints]
# workspace = true
# 
# 成员继承后,该成员不能再单独设置任何lint(如: [lints.rust]、[lints.clippy])
[workspace.lints.rust]
non_snake_case = "allow"
warnings = "allow"

# 编译配置(profile),只在workspace根的Cargo.toml中生效,写在成员中会被忽略
#
# 内置profile: cargo build使用dev,cargo build --release使用release
# 自定义profile: 用inherits继承内置profile后覆盖部分配置
# 使用: cargo build -p y_serde_serde_json --profile dist,产物在target/dist/
[profile.dist]
inherits = "release"
lto = true        # 链接时优化,运行更快、体积更小,编译更慢
codegen-units = 1 # 不并行生成代码,换取更好的优化
panic = "abort"   # panic时直接终止进程,不做栈展开
strip = true      # 去除符号信息,减小体积
