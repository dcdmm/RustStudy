[workspace]
# 依赖解析器版本,只在workspace根设置,所有成员共用(单个package通常不写,默认跟随edition)
# edition对应的默认resolver: 2015/2018 -> "1",2021 -> "2",2024 -> "3"
resolver = "3"

# members — Packages to include in the workspace.
members = [
    "crates/a_basic",
    "crates/b_basic",
    "crates/c_pattern_matching",
    "crates/d_error_handling",
    "crates/e_container",
    "f_advanced",
    "g_concurrency", 
    "h_file_operate",
    "i_macro", 
    "x_docs",
    "x_package_crate_module",
    "x_tests",
    "x_z_other", 
    "y_serde_serde_json",
    "x_z_other/x_cargo_feature",
    "z_tests"
]

# exclude — Packages to exclude from the workspace.
#
# y_tauri/src-tauri是独立的Tauri项目,依赖多编译慢,排除后:
# 1. 在根目录执行cargo build/test时不会编译它
# 2. 它有自己的Cargo.lock和target目录(y_tauri/src-tauri/target)
exclude = ["y_tauri"]

# 供workspace成员继承的package字段
#
# 成员需在自身[package]中按字段显式声明,如:
# version.workspace = true
# edition.workspace = true
#
# 同一字段继承后不能再单独设置(如: 继承version后不能再写version = "0.2.0")
[workspace.package]
version = "0.1.0"     # package版本号,格式为主版本.次版本.修订号
edition = "2024"      # 编译器按哪一版语法规则编译代码(可选: 2015/2018/2021/2024)
rust-version = "1.85" # 最低支持的Rust版本(MSRV),本地rustc低于该版本时报错

# 供workspace成员继承的依赖
#
# 成员需在自身[dependencies]中按依赖显式声明,如:
# serde.workspace = true
# serde_json.workspace = true
#
# 继承后只能追加features,但不能修改version(如: serde = { workspace = true, features = ["rc"] })
#
# 版本写法(省略前缀时等同于^):
# "1.0"    -> >=1.0.0, <2.0.0
# "0.8.5"  -> >=0.8.5, <0.9.0
# "~1.2.3" -> >=1.2.3, <1.3.0
# "=1.2.3" -> 只能是1.2.3
#
# 成员之间的依赖(path依赖):
# 1. 在成员中直接写路径(相对于成员自身的Cargo.toml)
#    z_tests中: i_macro = { path = "../i_macro" }
# 2. 在根Cargo.toml中写路径(相对于根Cargo.toml),成员再继承
#    根Cargo.toml中: i_macro = { path = "i_macro" }
#    z_tests中:      i_macro.workspace = true
#
# path依赖也可以指向workspace外的本地crate(不会成为成员),如my_utils与RustStudy在同一目录下:
# 1. z_tests中: my_utils = { path = "../../my_utils" }
# 2. 根Cargo.toml中: my_utils = { path = "../my_utils" }
#    z_tests中:      my_utils.workspace = true
[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 供workspace成员继承的rustc lint配置
# 
# 成员需在自身Cargo.toml中显式声明以下内容: 
# [lints]
# workspace = true
# 
# 成员继承后,该成员不能再单独设置任何lint(如: [lints.rust]、[lints.clippy])
[workspace.lints.rust]
non_snake_case = "allow"
warnings = "allow"
