[package]
name = "x_package_crate_module"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The library target defines a “library” that can be used and linked by other libraries and executables. The filename defaults to src/lib.rs, and the name of the library defaults to the name of the package. 
[lib]
name = "x_package_crate_module"
path = "src/lib.rs"

# Binary targets are executable programs that can be run after being compiled. The default binary filename is src/main.rs, which defaults to the name of the package. Additional binaries are stored in the src/bin/ directory. 
[[bin]]
name = "x_package_crate_module"
path = "src/main.rs"

[[bin]]
name = "additional_binary1"
path = "cb0.rs"

[[bin]]
name = "additional_binary2"
path = "cb1.rs"

[dependencies]
rand = "0.8.5" 