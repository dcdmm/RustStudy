[package]
name = "x_cargo_feature"
version = "0.1.0"
edition = "2024"

[features]
# 定义一个名为display的feature
# Each feature specifies an array of other features or optional dependencies that it enables. 
display = []

# By default, all features are disabled unless explicitly enabled. This can be changed by specifying the default feature:
# default = ["display"]

[dependencies]
# 启用serde的derive feature,开启后才能使用#[derive(Serialize)]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
