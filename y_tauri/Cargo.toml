[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
cpu_tasks = { path = "crates/cpu_tasks" }
io_tasks = { path = "crates/io_tasks" }
rand = "0.10"
rayon = "1.12"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = "1"

[profile.dev.package.cpu_tasks]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
